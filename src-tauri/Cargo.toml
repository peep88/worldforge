[package]
name = "worldforge"
version = "0.1.0"
description = "WorldForge - Fantasy World Building Desktop App"
authors = ["you"]
edition = "2021"

[package.metadata.bundle]
name = "WorldForge"
identifier = "com.worldforge.app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
